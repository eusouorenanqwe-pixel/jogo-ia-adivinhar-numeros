<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }
        h1 { 
            margin-bottom: 10px; 
            color: #4a5568; 
            font-size: 24px;
        }
        p { 
            color: #718096; 
            font-size: 14px; 
            margin-bottom: 20px; 
        }
        input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #667eea; }
        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #5a67d8; }
        .btn-reiniciar {
            background-color: #48bb78;
            margin-top: 10px;
        }
        .btn-reiniciar:hover {
            background-color: #38a169;
        }
        #mensagem {
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
            min-height: 40px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Adivinhe o Número</h1>
        <p>Tente adivinhar o número secreto entre <strong>1 e 100</strong>!</p>
        
        <input type="number" id="palpite" min="1" max="100" placeholder="Seu palpite">
        <button id="btnAdivinhar" onclick="verificarPalpite()">Enviar Palpite</button>
        <button id="btnReiniciar" class="btn-reiniciar hidden" onclick="reiniciarJogo()">Jogar Novamente</button>
        
        <div id="mensagem"></div>
    </div>

    <script>
        let numeroSecreto = Math.floor(Math.random() * 100) + 1;
        let tentativas = 0;

        function verificarPalpite() {
            const input = document.getElementById('palpite');
            const mensagem = document.getElementById('mensagem');
            const btnAdivinhar = document.getElementById('btnAdivinhar');
            const btnReiniciar = document.getElementById('btnReiniciar');
            
            const palpite = Number(input.value);

            if (!palpite || palpite < 1 || palpite > 100) {
                mensagem.style.color = '#e53e3e';
                mensagem.textContent = '⚠️ Digite um número válido entre 1 e 100!';
                return;
            }

            tentativas++;

            if (palpite === numeroSecreto) {
                mensagem.style.color = '#38a169';
                mensagem.textContent = `🎉 Parabéns! Você acertou o número ${numeroSecreto} em ${tentativas} tentativa(s)!`;
                input.disabled = true;
                btnAdivinhar.classList.add('hidden');
                btnReiniciar.classList.remove('hidden');
            } else if (palpite < numeroSecreto) {
                mensagem.style.color = '#dd6b20';
                mensagem.textContent = '📈 O número secreto é **maior** que isso!';
            } else {
                mensagem.style.color = '#3182ce';
                mensagem.textContent = '📉 O número secreto é **menor** que isso!';
            }

            input.value = '';
            input.focus();
        }

        // Permite enviar apertando a tecla "Enter"
        document.getElementById('palpite').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                verificarPalpite();
            }
        });
    </script>

</body>
</html>
